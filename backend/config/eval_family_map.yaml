# Ripple-family vocabulary map — analyst wording -> taxonomy slugs
#
# Gate Zero scoring only. A labeler writes "refiners"; the universe stores
# sub_sector "refining_marketing". Without this map the two never meet and
# ripple-family recall reads as a near-total miss that measures our
# vocabulary rather than the engine.
#
# STRUCTURAL TERM MAPPINGS ONLY. Nothing here is data: no exposure, no
# pass-through ratio, no weight, no financial figure of any kind. Each entry
# says "this is another name for that group of companies" and nothing more.
# A test asserts this file contains no numeric/financial token.
#
# Right-hand values MUST be slugs that exist in companies.sub_sector or
# companies.sector. Values were checked against backend/newsflo.db on
# 2026-08-17 (43 distinct sub_sectors, 11 sectors). A term that maps to a
# slug the universe does not have is reported by the scorer, not silently
# scored as a miss.
#
# Terms not listed here still work when the labeler types the slug itself
# (or a close string match); this map exists for the wording people
# actually use. Unknown wording is reported in BASELINE.md's MISMATCHED
# FAMILIES section — add it here rather than letting it score as zero.
#
# Format: `term: [slug, ...]` or `term: slug`. Lower-case terms.

