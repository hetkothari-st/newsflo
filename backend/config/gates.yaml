# V5 publication gate policy (docs/v5/NEWSFLO_V5_BUILD_SPEC.md §7.4,
# docs/v5/01_PHASE_0_canonical_truth.md Task 0.4).
#
# THIS FILE IS POLICY, NOT DATA. It contains thresholds the owner chooses;
# it contains no company facts, no exposures, no coefficients. Changing a
# number here changes what publishes -- it never changes what is true.
#
# Read by app/core/config_loader.py into the frozen GateConfig that
# app/core/gates.py evaluates. gates.py itself holds no thresholds, so the
# policy cannot drift between the file and the code.
#
# PHASE 0 SCOPE. Several §7.4 inputs do not exist in this repo yet
# (liquidity ADV, the independent verifier's verdict, the empirical
# cross-check, exposure freshness). Each has an `unknown_*` policy below
# saying what an ABSENT input means. Phases 1-5 supply the real inputs; the
# gate's structure does not change when they arrive.
#
# WHICH WAY EACH ONE FAILS -- READ THIS BEFORE TRUSTING THE PARAGRAPH ABOVE.
# Phase 0 set its four keys FAIL-CLOSED for PRIMARY (an input we cannot
# evaluate cannot authorize the strongest claim) and permissive for
# SECONDARY_RIPPLE. Phase 3 added two more, and they are NOT fail-closed:
#
#     unknown_materiality_delta_passes: true   # PRIMARY, FAIL-OPEN
#     unknown_sector_proxy_passes:      true   # PRIMARY, FAIL-OPEN
#
# They are fail-OPEN because nothing computes a band or a parameter
# provenance on the V4-fed canonical path today, and closing them would
# reject companies that publish now (measured 2026-08-17: 5 test failures
# when both are flipped -- the list is in the cutover checklist). So a draft
# with no computed band currently clears the PRIMARY materiality floor, and
# a draft with unknown parameter provenance currently clears the PRIMARY
# sector-proxy ban. That is a KNOWN HOLE, not an oversight.
#
# THE HAZARD IS THE PARTIAL ROLLOUT. The moment the sensitivity engine feeds
# SOME drafts, band-less drafts clear those two bars in silence next to
# drafts that had to earn it. `app/core/gate_warnings.py` emits a structured
# WARNING on every PRIMARY publication that leant on one of these escapes,
# so the hole is at least audible while it exists.
#
# FLIPPING THEM IS ITEM 1 OF THE "V5 SERVING CUTOVER CHECKLIST" IN
# DATA_GAPS.md. Do not flip them here without doing the fixture work that
# section names.

version: gate-v5.0.0

hard_blocks:
  # entity_status must be this to publish at all.
  required_entity_status: ACTIVE
  # A shock we cannot size confidently is a MACRO_CONTEXT statement at best
  # -- and MACRO_CONTEXT may never carry a company (invariant 6), so a
  # per-company draft in that state is REJECTED.
  min_shock_magnitude_confidence: 0.5
  # Materiality buckets that mean "there is nothing to say".
  no_impact_buckets: [NO_MATERIAL_IMPACT, NONE]

# V5 PHASE 3 (addendum A5.1) split the tier policies explicitly, because
# thresholds calibrated for PRIMARY silently kill ripple recall: a ripple
# candidate characteristically has a smaller delta-EBITDA, weaker evidence and
# proxy parameters. Three A5.1 keys are NEW here and each becomes a gate rule
# only when a tier names it (`materiality_floor_pct`, `allow_sector_proxy`,
# `min_companies_per_section`). A5.1's `max_distance` and `min_evidence_grade`
# are NOT new keys: `max_graph_distance` IS `max_distance`, and
# `min_evidence_grade` is the weakest entry of `evidence_grades` -- so it is
# stated here as a floor and the loader REFUSES a file where the two
# disagree. One policy, one place, two spellings that cannot drift.
#
# A5.3, the guardrail: nothing about the ripple block loosens PRIMARY. Every
# primary threshold below is what Phase 0 deployed, and a test pins each one.
primary:
  max_graph_distance: 2
  # Minimum |delta EBITDA| as a percentage of EBITDA_ttm. A draft with no
  # computed band cannot be shown to clear this and does not pass by omission.
  materiality_floor_pct: 2.0
  # A sector-median parameter may never back a PRIMARY call (§7.4). The
  # forbidden weakest-link list below says the same thing about EVIDENCE;
  # this says it about PARAMETERS, which is a different input.
  allow_sector_proxy: false
  # V5 PHASE 4 / spec §9.3. A company whose tracked regime reading (a fuel
  # price freeze, a levy rate) has gone stale past its own freshness window
  # cannot make a PRIMARY call: the modifier that shaped its number was
  # applied on a reading nobody has refreshed. It may still publish as a
  # ripple, which is the weaker claim the weaker input supports.
  #
  # This is NOT fail-open like the two A5.1 keys above it: `policy_state` is
  # empty in production, so no company depends on a stale reading and the
  # rule changes no verdict today. The moment a state is registered and goes
  # stale, it starts blocking -- which is the behaviour §9.3 asks for.
  allow_stale_policy_state: false
  min_evidence_grade: C
  # DIRECT at distance 1, or DIRECT|INDIRECT at distance 2 with HIGH
  # materiality. REMOTE never publishes primary.
  allowed_directness: [DIRECT, INDIRECT]
  directness_at_d1: [DIRECT]
  materiality_buckets: [HIGH]
  # MEDIUM materiality is admissible only with strong evidence.
  medium_materiality_evidence_grades: [A, B]
  evidence_grades: [A, B, C]
  forbidden_weakest_link_statuses: [SECTOR_PROXY, UNBOUND]
  min_sign_consistency: 0.90
  # V5 PHASE 5 (spec §10.2). CONFLICT is absent, which is what caps a
  # contradicted candidate at SECONDARY_RIPPLE -- no code does that, this line
  # does. WEAK is absent too, and that is a FROZEN SPEC VALUE, not a judgement
  # this phase made: BUILD_SPEC §7.4's {AGREE, NO_DATA} allowlist is normative
  # and EXECUTION_CONTRACT §7.1 freezes it, so amending it needs a failing
  # measurement under §7.2 and none exists yet.
  #
  # Phase 5 ARGUED for admitting WEAK (an insignificant sample carries the same
  # information as no sample, so "we measured and found nothing conclusive"
  # currently publishes strictly worse than "we never measured"). That argument
  # is recorded as PROPOSED SPEC AMENDMENT 1 in DATA_GAPS, with the missing
  # prerequisite named. It is not implemented here.
  #
  # WEAK IS allowed at secondary_ripple -- that block states no
  # allowed_empirical_status at all, so no empirical rule is walked there.
  allowed_empirical_status: [AGREE, NO_DATA]
  # §10.3: a human reviewer who marks the conflict REGIME_CHANGED, with a
  # reason and an EXPIRY, makes PRIMARY available again for that (company,
  # shock class). The status stays CONFLICT -- the record keeps saying what
  # history said; this only decides whether that blocks the strongest claim.
  allow_regime_changed_conflict: true
  # §13.2: a candidate outside the calibration training manifold cannot lead.
  # UNKNOWN passes (no manifold is fitted and none can be until a labeled
  # corpus exists), so this rule changes no verdict today. See gates.py.
  allow_out_of_distribution: false
  max_objection_severity_sustained: WARN
  required_verifier_status: PASS
  min_adv_inr: null           # no liquidity feed wired yet -> see unknown_*
  allowed_event_status: [CONFIRMED, OFFICIAL]
  unknown_verifier_status_passes: false
  unknown_empirical_status_passes: false
  unknown_liquidity_passes: true      # nothing to evaluate; not a silent pass
  unknown_event_status_passes: false
  # PHASE 3. No computed band and no parameter provenance reach a draft on
  # the V4-fed canonical path today (Phase 2's engine supplies both, and it
  # needs ledger rows that do not exist). Deployed TRUE so this task changes
  # no verdict, and stated here rather than hidden in a default. FLIP BOTH TO
  # FALSE the day the sensitivity engine feeds every draft -- at which point
  # a draft with no band should not be able to claim anything at all.
  unknown_materiality_delta_passes: true
  unknown_sector_proxy_passes: true

secondary_ripple:
  max_graph_distance: 3
  # Lower than primary -- small but real is still tradeable (A5.1). This is
  # not a loosening of the primary bar; it is a different claim with a
  # different bar, which is the whole point of splitting the block.
  materiality_floor_pct: 0.75
  # Permitted, WITH UI LABELLING as a sector-level estimate (A4.3). The
  # structural consequence is already elsewhere: a proxy parameter caps
  # evidence at C and can never reach PRIMARY.
  allow_sector_proxy: true
  # Permitted at the ripple tier, WITH the modifier chip visible (Task 4.4).
  # A stale regime reading is a reason not to lead with a company; it is not
  # a reason to pretend the mechanism does not exist.
  allow_stale_policy_state: true
  min_evidence_grade: D
  # A5.1. Section-level, not company-level: it is read by
  # app/discovery/coherence.py, which decides whether a SECTION publishes.
  min_companies_per_section: 1
  materiality_buckets: [HIGH, MEDIUM]
  low_materiality_evidence_grades: [A, B]
  evidence_grades: [A, B, C, D]
  min_sign_consistency: 0.60
  # Below the floor a company may still publish, but only as MIXED or
  # UNCERTAIN (invariants 8 and 9) -- never as a direction.
  below_floor_allowed_effects: [MIXED, UNCERTAIN]
  # Invariant 7: SECONDARY_RIPPLE requires a non-null mechanism_id.
  require_mechanism_id: true
  # V5 PHASE 5 (spec §10.3). THE ONE LINE THAT MAKES "CAP, DO NOT REJECT" TRUE.
  # An empirical conflict attaches a SUSTAINED MAJOR objection, and the gate's
  # objections rule refuses a sustained MAJOR at both tiers by default -- so
  # without this exemption the phase file's "cap at SECONDARY_RIPPLE" would
  # have been an auto-REJECT, which §10.3 explicitly forbids. Narrow by
  # construction: ONE objection type, at ONE tier. PRIMARY does not exempt it,
  # so a contradicted candidate still cannot lead a page, and every other MAJOR
  # objection still rejects here exactly as it did before Phase 5.
  objection_types_exempt_from_severity_cap: [EMPIRICAL_CONFLICT]
  unknown_verifier_status_passes: true
  unknown_empirical_status_passes: true
  # See the primary block: TRUE today because nothing computes these on the
  # canonical path yet, and both flip when the sensitivity engine does.
  unknown_materiality_delta_passes: true
  unknown_sector_proxy_passes: true
