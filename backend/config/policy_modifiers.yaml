      capture_fraction_above: null
    source_url: null
    source_hint: CBIC notification (Department of Revenue).
    owner: OWNER-REQUIRED
    review_interval_days: null
    last_reviewed_at: null
    note: >
      Acts on the export slice of refining margin. Whether a given refiner's
      margin exposure is export-weighted is a LEDGER question
      (company_exposure), not a registry one.

