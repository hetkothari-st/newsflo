  - id: IN_RETAIL_FUEL_REVISION_STATE
    applies_to_tag: revenue:marketing_margin_retail_fuel
    jurisdiction: IN
    type: STATE_DEPENDENT
    effective_from: null
    effective_to: null
    parameters:
      _required: [state_key, when]
      state_key: null
      when: null
    source_url: null
    source_hint: >
      There is no notification for this one. Whether retail price revisions
      are currently being made is an OBSERVED state, and `policy_state` is
      where the observation lives -- with a freshness window and an owner.
    owner: OWNER-REQUIRED
    review_interval_days: null
    last_reviewed_at: null
    note: >
      Freeze windows collapse marketing-margin pass-through. While the state
      is unknown the channel widens and caps at C rather than assuming either
      regime -- which is what the engine does today, since policy_state is
      empty.

