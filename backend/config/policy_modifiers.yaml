  - id: IN_SAED_WINDFALL_LEVY_CRUDE
    applies_to_tag: revenue:crude_realization
    jurisdiction: IN
    type: THRESHOLD_CAPTURE
    effective_from: 2022-07-01
    date_basis: >
      the date the Special Additional Excise Duty on domestically produced
      crude was first notified. A public structural fact about when a regime
      began, not a rate.
    effective_to: null
    parameters:
      _required: [threshold_level, capture_fraction_above]
      threshold_level: null
      capture_fraction_above: null
    source_url: null
    source_hint: >
      CBIC notification (Department of Revenue, Ministry of Finance), revised
      fortnightly while in force.
    owner: OWNER-REQUIRED
    review_interval_days: null
    last_reviewed_at: null
    note: >
      Above the threshold, upstream realisation upside is largely transferred
      to the exchequer. Publishing "upstream POSITIVE, HIGH" on rising crude
      without this is the credibility failure spec §9 opens with.

