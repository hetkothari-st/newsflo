# V5 POLICY MODIFIER REGISTRY
# (docs/v5/NEWSFLO_V5_BUILD_SPEC.md §9, docs/v5/05_PHASE_4_policy_horizon.md
#  Task 4.1)
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE ADDING A NUMBER
# ---------------------------------------------------------------------------
# THIS FILE IS STRUCTURE, NOT DATA. Every entry below says WHAT a regime is,
# WHICH exposure it acts on, WHICH transfer function it is and WHICH
# parameters it needs. Not one of them says what those parameters ARE.
#
# That is deliberate and it is the single most important property of this
# file. A windfall levy threshold, an administered gas ceiling, an export
# duty rate or a subsidy split is a CLAIM ABOUT THE WORLD on a specific date.
# Writing one here from memory would be invisible: the output would look MORE
# credible, not less, and the error would surface as a confidently wrong
# impact call months later. The phase file's own DO NOT is explicit --
# "Do not populate modifier parameters (levy rates, thresholds, ceilings) from
# your own knowledge. Scaffold the entry, leave parameters null, log the gap,
# name the owner."
#
# HOW THE REFUSAL IS ENFORCED (not by this comment):
#   * every `owner` is the placeholder OWNER-REQUIRED;
#   * every parameter value is null;
#   * `app/analysis/policy/registry.modifier_from_mapping` loads any entry
#     missing an owner, a parameter, a source URL, an effective date or a
#     review cadence with status SCAFFOLD;
#   * `PolicyRegistry.active_for` never returns a SCAFFOLD entry, and
#     `materialise` never writes one, so `policy_modifier` ships EMPTY.
#
# TO ACTIVATE AN ENTRY (the whole workflow):
#   1. find the notification. Put its URL in `source_url`.
#   2. fill EVERY name under `parameters._required` with the value that
#      notification states. Delete nothing from `_required`.
#   3. put your own name in `owner` (e.g. `human:naman`), set
#      `review_interval_days` to how often that regime actually changes, and
#      `last_reviewed_at` to today.
#   4. set `effective_from` to the date the notification takes force.
#   5. run the loader. The entry becomes ACTIVE and starts modifying numbers.
#
# DATES. `effective_from` is filled in ONLY where the date a public regime
# came into force is structural, uncontroversial knowledge, and every such
# date carries a `date_basis` naming the act it refers to. Everywhere else it
# is null and the owner supplies it. A date is not a financial parameter --
# but a date I am not sure of is still a fabrication.
#
# TAGS. `applies_to_tag` must be a tag in `config/exposure_tags.yaml`. Several
# regimes below act on an exposure the vocabulary does not yet express (a
# steel producer's realisation, a PLI incentive, a bank's risk weight); those
# carry `applies_to_tag: null` and a `pending_tag` naming the leaf the
# vocabulary needs. They are scaffolded rather than dropped because the gap is
# the point: the registry says what the system cannot yet model.
#
# GAPS: DATA_GAPS.md §8 lists every entry here, what it is missing and who
# must supply it.

